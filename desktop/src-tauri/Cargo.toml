[package]
name = "global-auto-parts"
version = "1.0.0"
description = "Global Auto Parts retail desktop application"
authors = ["Global Auto Parts"]
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
open = "5"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dev-dependencies]
minisign-verify = "0.3"
base64 = "0.22"
